[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clearset"
version = "1.0.0"
description = "Deterministic Context Resets, SQLite Blackboard State & Token-Budgeted Retrieval for AI Coding Agents."
readme = "README.md"
authors = [{ name = "Arika" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Core310/clearset"
Repository = "https://github.com/Core310/clearset.git"

[project.scripts]
cs = "clearset.engine:main"
cs-fetch = "clearset.fetch:main"
cs-sync = "clearset.sync:main"
cs-gate = "clearset.gate:main"
cs-mcp = "clearset.mcp:main"
cs-cleanup = "clearset.cleanup:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clearset*"]
